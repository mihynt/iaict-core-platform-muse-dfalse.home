[project]
name = "iaict-core-platform-worker"
version = "0.2.0"
description = "IAICT Core Platform API packaged as a Cloudflare Python Worker (beta hosting, DEC-006)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
